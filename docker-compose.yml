# LiteLLM gateway for the multi-node Ollama setup.
#
# No Postgres: we define models in litellm-config.yaml, not in the DB, so the
# plain `litellm` image is enough (the `litellm-database` image + Postgres only
# buy you DB-stored models, virtual keys and spend logs).
#
#   docker compose up -d
#   curl http://127.0.0.1:4000/v1/models -H "Authorization: Bearer $LITELLM_MASTER_KEY"
services:
  litellm:
    image: docker.litellm.ai/berriai/litellm:main-stable
    ports:
      - "4000:4000"
    volumes:
      - ./litellm-config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set it in .env}
    # The node names in litellm-config.yaml are resolved here, so the
    # config file stays identical for everyone on the team and only this mapping
    # changes per machine depending on the values set in .env (see .env.example).
    extra_hosts:
      - "node-a:${NODE_A_IP:?set it in .env}"
      - "node-b:${NODE_B_IP:?set it in .env}"
      - "node-c:${NODE_C_IP:?set it in .env}"
      - "node-d:${NODE_D_IP:?set it in .env}"
      - "node-e:${NODE_E_IP:?set it in .env}"
      - "node-f:${NODE_F_IP:?set it in .env}"
    restart: unless-stopped
