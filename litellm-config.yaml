# Routing definition for the distributed workflow.
#
# Each of the six assignment responsibilities gets its own model name, and each
# model name is bound to one node. Routing is a literal string match on
# `model_name` -- Hermes asks for "tester", LiteLLM looks up this file and knows
# which machine to dial. Nothing is rewired between runs.
#
# The node-a..node-f hostnames are resolved by the `extra_hosts` block in
# docker-compose.yml (values in .env), so this file is identical on every
# teammate's machine.

model_list:

  # === Role-bound routing: one responsibility, one node ==================
  # Profile name == model name == role, so `hermes --profile tester -m tester`
  # reads as one thing.

  # 1. Architecture: component decomposition, interface contracts (OpenAPI),
  #    deployment topology, ADRs.
  - model_name: architect
    litellm_params:
      model: ollama_chat/llama3.1:8b
      api_base: http://node-a:11434

  # 2. Tech lead: tickets with scope boundaries, acceptance criteria and
  #    dependency ordering.
  - model_name: techlead
    litellm_params:
      model: ollama_chat/llama3.1:8b
      api_base: http://node-b:11434

  # 3. Implementation: multi-file changes across the repo. Fans out to the
  #    `worker` pool below for the N>=2 parallel-workers requirement.
  - model_name: coder
    litellm_params:
      model: ollama_chat/qwen2.5-coder:14b
      api_base: http://node-c:11434

  # 4. Testing & quality: writes and runs tests, produces the quality report.
  - model_name: tester
    litellm_params:
      model: ollama_chat/qwen2.5-coder:14b
      api_base: http://node-d:11434

  # 5. Documentation: README, API usage, runbook, design docs.
  - model_name: docs
    litellm_params:
      model: ollama_chat/llama3.1:8b
      api_base: http://node-e:11434

  # 6. Deployment validation: Dockerfile/compose, deployment checklist,
  #    environment and configuration documentation.
  - model_name: deployer
    litellm_params:
      model: ollama_chat/qwen2.5-coder:14b
      api_base: http://node-f:11434

  # === Load-balanced pool: same name, several hosts =====================
  # LiteLLM spreads calls across every entry sharing this name. This is what
  # Hermes' `delegation.model` targets, since its delegation config is global.
  #
  # The pool is the three nodes that already hold qwen2.5-coder:14b. During the
  # implementation phase the tester and deployer nodes are idle, so lending them
  # to the fan-out costs nothing and gives N=3 concurrent coding workers.
  - model_name: worker
    litellm_params:
      model: ollama_chat/qwen2.5-coder:14b
      api_base: http://node-c:11434
  - model_name: worker
    litellm_params:
      model: ollama_chat/qwen2.5-coder:14b
      api_base: http://node-d:11434
  - model_name: worker
    litellm_params:
      model: ollama_chat/qwen2.5-coder:14b
      api_base: http://node-f:11434

router_settings:
  routing_strategy: least-busy
  num_retries: 2

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
