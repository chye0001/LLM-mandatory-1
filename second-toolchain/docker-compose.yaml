services:
  opencode:
    build:
      context: .
      args:
        LANG_PACKAGES: ${LANG_PACKAGES:-nodejs npm python3}
    image: opencode-sandbox
    working_dir: /workspace
    env_file:
      - .env
    user: "1000:1000"
    volumes:
      - .:/workspace
      - ./.opencode:/workspace/.opencode:ro
      - opencode-config:/home/dev/.config/opencode
      - opencode-state:/home/dev/.local/share/opencode
    stdin_open: true
    tty: true

volumes:
  opencode-config:
  opencode-state:
